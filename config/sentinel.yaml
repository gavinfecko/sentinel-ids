# sentinel-ids configuration. Every detector can be tuned or disabled here.
# Pass with:  --config config/sentinel.yaml

# Networks you consider "home". When set, external<->external traffic (neither
# endpoint yours) is skipped as noise, and every alert is tagged inbound/outbound/
# internal. Empty (default) monitors ALL traffic — safest, no silent drops.
# Set this to YOUR LAN subnet to enable direction filtering + noise reduction,
# e.g.  home_net: ["192.168.1.0/24"].  A wrong subnet here would drop everything.
home_net: []

detectors:
  port_scan:
    enabled: true
    threshold: 15      # distinct destination ports...
    window: 10.0       # ...seen within this many seconds -> alert

  stealth_scan:
    enabled: true      # NULL/FIN/XMAS/Maimon flag combinations

  host_sweep:
    enabled: true
    threshold: 10      # distinct hosts probed...
    window: 15.0       # ...within this window

  syn_flood:
    enabled: true
    threshold: 200     # SYNs to one service...
    window: 5.0        # ...within this window -> DoS

  arp_spoof:
    enabled: true      # IP-to-MAC binding changes
    # Trusted IP->MAC pairs (e.g. your gateway). Legit rebinding to these is
    # silent; an allowlisted IP seen with a DIFFERENT MAC is flagged as
    # impersonation (high confidence). Find your gateway's MAC with:
    #   arp -an | grep <gateway-ip>
    # allowlist:
    #   "192.168.0.1": "aa:bb:cc:dd:ee:ff"

  brute_force:
    enabled: true
    threshold: 25      # connection attempts to an auth port...
    window: 30.0       # ...within this window

  icmp_anomaly:
    enabled: true
    max_payload: 128   # ICMP data larger than this is suspicious

# Payload signature ruleset (regex rules).
rules: rules/signatures.yaml

# Real-time notifications for high-severity alerts (opt-in). ntfy = free phone push.
notify:
  enabled: false
  min_severity: critical
  cooldown: 30
  desktop: true                 # macOS Notification Center (local)
  ntfy_topic: ""                # e.g. "gavin-ids-7f3a" -> https://ntfy.sh/<topic> on your phone
  ntfy_server: "https://ntfy.sh"
  webhook_url: ""               # optional Slack/Discord webhook
  resend: {api_key: "", from: "", to: ""}   # optional email
